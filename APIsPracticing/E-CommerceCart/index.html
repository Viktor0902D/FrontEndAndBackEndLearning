<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore Cart</title>
    <style>
        /* Minimal CSS for layout */
        body { font-family: sans-serif; display: flex; padding: 2rem; gap: 2rem; background: #f4f4f4;}
        .store { flex: 2; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
        .product-card { background: white; padding: 1rem; border-radius: 8px; text-align: center; }
        .product-card img { width: 100px; height: 100px; object-fit: cover; }
        .cart-panel { flex: 1; background: white; padding: 1.5rem; border-radius: 8px; height: fit-content; }
        .cart-item { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 0.5rem 0; }
        button { background: #2c3e50; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
        .total-display { font-size: 1.5rem; font-weight: bold; margin-top: 1rem; text-align: right; }
    </style>
</head>
<body>

    <main class="store" id="store-grid">
        </main>

    <aside class="cart-panel">
        <h2>Shopping Cart</h2>
        <div id="cart-items">
            </div>
        <div class="total-display">Total: <span id="cart-total">0.00</span></div>
    </aside>

    <script type="module" src="app.js"></script>
</body>
</html>
