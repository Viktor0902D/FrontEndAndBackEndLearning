<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="weather-dashboard">
        <header>
            <h1>Weather in <span id="city-name">Varna</span></h1>
        </header>
        
        <section class="metrics-grid">
            <div class="card">
                <p class="label">Temperature</p>
                <h2 id="temperature-display">-- °C</h2>
            </div>

            <div class="card">
                <p class="label">Wind Speed</p>
                <h2 id="wind-display">-- km/h</h2>
            </div>
        </section>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
