<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microservice Status Board</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1e1e2e; color: white; padding: 2rem; display: flex; flex-direction: column; align-items: center; }
        header { text-align: center; margin-bottom: 2rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; width: 100%; max-width: 900px; }
        
        /* The Card Base */
        .server-card { background: #2a2a35; padding: 1.5rem; border-radius: 8px; border-top: 5px solid gray; text-align: center; transition: all 0.3s; }
        .server-card h3 { margin-top: 0; color: #cdd6f4; }
        .badge { display: inline-block; padding: 0.4rem 1rem; border-radius: 20px; font-weight: bold; font-size: 0.9rem; margin: 1rem 0; }
        .timestamp { font-size: 0.8rem; color: #89b4fa; }

        /* The Dynamic States (You will apply these with JS) */
        .online { border-top-color: #a6e3a1; }
        .online .badge { background: rgba(166, 227, 161, 0.2); color: #a6e3a1; }
        
        .offline { border-top-color: #f38ba8; animation: pulse 2s infinite; }
        .offline .badge { background: rgba(243, 139, 168, 0.2); color: #f38ba8; }
        
        .checking { border-top-color: #f9e2af; opacity: 0.7; }
        .checking .badge { background: rgba(249, 226, 175, 0.2); color: #f9e2af; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(243, 139, 168, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(243, 139, 168, 0); }
            100% { box-shadow: 0 0 0 0 rgba(243, 139, 168, 0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>System Status</h1>
        <p>Polling microservices every 5 seconds...</p>
    </header>

    <main class="grid" id="status-grid">
        </main>

    <script type="module" src="app.js"></script>
</body>
</html>
